<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tanner Hill Dodd · Library</title>
<meta name="description" content="Tanner Hill Dodd's clips, the old-school way.">
<meta name="theme-color" content="#cfcfcf">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='8' width='28' height='17' rx='8' fill='%23333'/%3E%3Ccircle cx='10' cy='16.5' r='2' fill='%23fff'/%3E%3Ccircle cx='22' cy='15' r='1.6' fill='%23fff'/%3E%3Ccircle cx='25' cy='18' r='1.6' fill='%23fff'/%3E%3C/svg%3E">
<style>
/* A retro desktop media-library take on the portfolio: toolbar with a green LCD, source list, cover flow, song list, pop-up player window. Same content as the main site (/api/content). */
:root{
  --f:"Lucida Grande","Lucida Sans Unicode","Lucida Sans",Geneva,Verdana,system-ui,sans-serif;
  --chrome-top:#e9e9e9;--chrome-bot:#b9b9b9;--chrome-line:#7d7d7d;
  --btn-top:#ffffff;--btn-bot:#cdcdcd;--btn-line:#8b8b8b;--btn-ink:#3a3a3a;
  --lcd-top:#eef3d8;--lcd-bot:#d4dcae;--lcd-line:#8e9670;--lcd-ink:#1d1f14;--lcd-dim:#4b5038;
  --side:#dbe1e9;--side-head:#6e7782;--side-ink:#1c1c1c;--side-sel-top:#7aa0d8;--side-sel-bot:#3f6fb8;
  --list:#ffffff;--list-alt:#eef3fa;--list-ink:#1a1a1a;--list-dim:#6d6d6d;--list-head-top:#f6f6f6;--list-head-bot:#dadada;--list-line:#c6c6c6;
  --sel-top:#86a8dc;--sel-bot:#5d86c8;
  --flow:#000;--flow-ink:#f2f2f2;
  --status:#bdbdbd;--status-ink:#2a2a2a;
  --panel:#f1f1f1;--panel-ink:#1a1a1a;
  --win-top:#ececec;--win-bot:#c9c9c9;
}
:root[data-theme="dark"]{
  --chrome-top:#4a4a4a;--chrome-bot:#262626;--chrome-line:#0d0d0d;
  --btn-top:#5c5c5c;--btn-bot:#2d2d2d;--btn-line:#111;--btn-ink:#e4e4e4;
  --lcd-top:#4d5a6b;--lcd-bot:#2a3340;--lcd-line:#11161d;--lcd-ink:#eef3fa;--lcd-dim:#aab6c6;
  --side:#262a30;--side-head:#8a929c;--side-ink:#e6e6e6;--side-sel-top:#5f6b7a;--side-sel-bot:#3c4553;
  --list:#1b1b1b;--list-alt:#232323;--list-ink:#e8e8e8;--list-dim:#9a9a9a;--list-head-top:#3a3a3a;--list-head-bot:#262626;--list-line:#0f0f0f;
  --sel-top:#5a7397;--sel-bot:#3b5478;
  --status:#262626;--status-ink:#cfcfcf;
  --panel:#202020;--panel-ink:#ececec;
  --win-top:#4a4a4a;--win-bot:#2b2b2b;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:#000;color:var(--list-ink);font:12px/1.35 var(--f);overflow:hidden;-webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
a{color:inherit}
svg{display:block}
.app{position:fixed;inset:0;display:grid;grid-template-rows:auto minmax(0,1fr) auto;background:var(--list)}

/* ---------- Toolbar ---------- */
.bar{display:grid;grid-template-columns:minmax(150px,1fr) minmax(240px,440px) minmax(150px,1fr);align-items:center;gap:14px;padding:8px 14px 9px;padding-top:max(8px,env(safe-area-inset-top));background:linear-gradient(var(--chrome-top),var(--chrome-bot));border-bottom:1px solid var(--chrome-line)}
.transport{display:flex;align-items:center;gap:6px}
.vol{display:flex;align-items:center;gap:6px;margin-top:6px;color:var(--btn-ink)}
.vol svg{width:12px;height:12px;opacity:.75}
.round{width:30px;height:30px;border-radius:50%;border:1px solid var(--btn-line);background:linear-gradient(var(--btn-top),var(--btn-bot));display:grid;place-items:center;color:var(--btn-ink);cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 1px 1px rgba(0,0,0,.15);padding:0}
.round.big{width:38px;height:38px}
.round svg{width:13px;height:13px;fill:currentColor}
.round.big svg{width:16px;height:16px}
.round:active{background:linear-gradient(var(--btn-bot),var(--btn-top))}
input[type=range]{-webkit-appearance:none;appearance:none;background:transparent;height:14px;margin:0;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:5px;border-radius:3px;background:linear-gradient(#7a7a7a,#a9a9a9);box-shadow:inset 0 1px 1px rgba(0,0,0,.3)}
input[type=range]::-moz-range-track{height:5px;border-radius:3px;background:linear-gradient(#7a7a7a,#a9a9a9)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;margin-top:-4px;border-radius:50%;background:radial-gradient(circle at 50% 35%,#fff,#bdbdbd);border:1px solid #6b6b6b}
input[type=range]::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:radial-gradient(circle at 50% 35%,#fff,#bdbdbd);border:1px solid #6b6b6b}
#vol{width:92px}

.lcd{position:relative;height:52px;border-radius:7px;border:1px solid var(--lcd-line);background:linear-gradient(var(--lcd-top),var(--lcd-bot));box-shadow:inset 0 1px 3px rgba(0,0,0,.22),0 1px 0 rgba(255,255,255,.35);color:var(--lcd-ink);text-align:center;padding:5px 34px 0;overflow:hidden}
.lcd b{display:block;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lcd small{display:block;font-size:11px;color:var(--lcd-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lcd .prog{display:grid;grid-template-columns:42px 1fr 42px;align-items:center;gap:6px;font-size:10px;color:var(--lcd-dim);margin-top:2px}
.lcd .prog span:last-child{text-align:right}
.lcd .track{position:relative;height:9px;border:1px solid var(--lcd-dim);border-radius:5px;cursor:pointer;overflow:hidden}
.lcd .track i{position:absolute;inset:0 auto 0 0;width:0;background:var(--lcd-dim);opacity:.55}
.lcd .side{position:absolute;top:50%;width:14px;height:14px;margin-top:-7px;border-radius:50%;border:1px solid var(--lcd-dim);background:radial-gradient(circle at 50% 40%,rgba(255,255,255,.7),transparent 70%)}
.lcd .side.l{left:11px}.lcd .side.r{right:11px}
.lcd.idle .prog{visibility:hidden}

.right{display:flex;justify-content:flex-end;align-items:center;gap:12px}
.seg{display:flex;border:1px solid var(--btn-line);border-radius:5px;overflow:hidden;box-shadow:0 1px 1px rgba(0,0,0,.12)}
.seg button{border:0;border-left:1px solid var(--btn-line);background:linear-gradient(var(--btn-top),var(--btn-bot));width:30px;height:22px;display:grid;place-items:center;cursor:pointer;color:var(--btn-ink);padding:0}
.seg button:first-child{border-left:0}
.seg button svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.6}
.seg button[aria-pressed=true]{background:linear-gradient(#6d6d6d,#9b9b9b);color:#fff;box-shadow:inset 0 1px 3px rgba(0,0,0,.4)}
.search{position:relative}
.search input{width:150px;height:22px;border-radius:11px;border:1px solid var(--btn-line);padding:0 10px 0 24px;background:#fff;color:#111;box-shadow:inset 0 1px 2px rgba(0,0,0,.25);outline:none;-webkit-user-select:text;user-select:text}
.search input:focus{box-shadow:0 0 0 3px rgba(90,140,220,.55)}
.search svg{position:absolute;left:8px;top:5px;width:12px;height:12px;stroke:#777;fill:none;stroke-width:2}

/* ---------- Body ---------- */
.main{display:grid;grid-template-columns:182px minmax(0,1fr);min-height:0}
.src{background:var(--side);border-right:1px solid var(--chrome-line);overflow:auto;padding:10px 0 20px;color:var(--side-ink)}
.src h3{margin:12px 0 4px;padding:0 12px;font-size:11px;font-weight:700;color:var(--side-head);letter-spacing:.02em;text-transform:uppercase}
.src h3:first-child{margin-top:2px}
.src button,.src a{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;padding:4px 12px 4px 18px;text-align:left;cursor:pointer;font-size:12px;text-decoration:none;color:inherit;min-height:24px}
.src svg{width:13px;height:13px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;opacity:.8}
.src [aria-current=true]{background:linear-gradient(var(--side-sel-top),var(--side-sel-bot));color:#fff;font-weight:700;border-top:1px solid rgba(0,0,0,.15)}
.src [aria-current=true] svg{opacity:1}

.content{position:relative;display:grid;grid-template-rows:minmax(0,58fr) 7px minmax(0,42fr);min-width:0;min-height:0;background:var(--list)}

.list-only .split,.grid-only .split,.panel-only .split{visibility:hidden;border:0}
.content.list-only{grid-template-rows:0 0 minmax(0,1fr)}
.content.grid-only{grid-template-rows:minmax(0,1fr) 0 0}
.content.panel-only{grid-template-rows:minmax(0,1fr) 0 0}

/* ---------- Cover flow ---------- */
.flow{position:relative;background:radial-gradient(120% 70% at 50% 110%,#2a2a2a 0,#050505 55%,#000 100%);overflow:hidden;color:var(--flow-ink);touch-action:pan-y;cursor:grab}
.flow:active{cursor:grabbing}
.stage{position:absolute;inset:0 0 58px;perspective:900px;perspective-origin:50% 45%}
.cover{position:absolute;left:50%;top:0;transform-style:preserve-3d;will-change:transform}
.cover .face{position:absolute;inset:0;background:#111 center/cover no-repeat;box-shadow:0 0 0 1px rgba(255,255,255,.06)}
.cover .face video,.cover .face .vid{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
.cover .refl{position:absolute;left:0;right:0;top:100%;height:100%;margin-top:2px;background:#111 center/cover no-repeat;transform:scaleY(-1);-webkit-mask-image:linear-gradient(to top,rgba(0,0,0,.32),rgba(0,0,0,0) 45%);mask-image:linear-gradient(to top,rgba(0,0,0,.32),rgba(0,0,0,0) 45%);pointer-events:none}
.cover .shade{position:absolute;inset:0;background:#000;pointer-events:none;opacity:0}
.cover .face .vid{background:#000}
.cover.playing .face{box-shadow:0 0 0 1px rgba(255,255,255,.18)}
.cap{position:absolute;left:0;right:0;bottom:30px;text-align:center;font-size:12.5px;font-weight:700;text-shadow:0 1px 2px #000;padding:0 60px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cap small{font-weight:400;color:#bdbdbd;margin-left:6px}
.arrow{position:absolute;top:calc(50% - 40px);width:28px;height:28px;border-radius:50%;border:1px solid #555;background:radial-gradient(circle at 50% 30%,#e6e6e6,#9e9e9e);display:grid;place-items:center;cursor:pointer;color:#333;padding:0;z-index:2000;opacity:.85}
.arrow svg{width:10px;height:10px;fill:currentColor}
.arrow.l{left:14px}.arrow.r{right:14px}
.scroller{position:absolute;left:50%;bottom:12px;width:min(62%,560px);transform:translateX(-50%);height:12px;border-radius:7px;background:linear-gradient(#141414,#2b2b2b);border:1px solid #3a3a3a;z-index:2000;cursor:pointer}
.scroller i{position:absolute;top:1px;bottom:1px;border-radius:5px;background:linear-gradient(#f0f0f0,#9a9a9a);min-width:28px}
.empty-flow{position:absolute;inset:0;display:grid;place-items:center;color:#888;font-size:13px}
.hint{position:absolute;top:10px;left:0;right:0;text-align:center;font-size:11px;color:#777;pointer-events:none;transition:opacity .6s}

.split{background:linear-gradient(#d6d6d6,#a9a9a9);border-top:1px solid #8a8a8a;border-bottom:1px solid #8a8a8a;cursor:row-resize;position:relative}
.split::after{content:"";position:absolute;left:50%;top:2px;width:30px;margin-left:-15px;height:1px;border-top:1px solid #7a7a7a;border-bottom:1px solid #f2f2f2}
:root[data-theme=dark] .split{background:linear-gradient(#3a3a3a,#1f1f1f);border-color:#0b0b0b}

/* ---------- List ---------- */
.list{overflow:auto;background:var(--list);min-height:0;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;table-layout:fixed}
thead th{position:sticky;top:0;z-index:1;text-align:left;font-weight:400;font-size:11.5px;padding:3px 8px;background:linear-gradient(var(--list-head-top),var(--list-head-bot));border-bottom:1px solid var(--list-line);border-right:1px solid var(--list-line);color:var(--list-ink);white-space:nowrap;cursor:pointer}
thead th[aria-sort]{background:linear-gradient(#c9d9f1,#93b2df);color:#0d1d36}
:root[data-theme=dark] thead th[aria-sort]{background:linear-gradient(#58708f,#3b5070);color:#fff}
tbody tr{cursor:default}
tbody tr:nth-child(even){background:var(--list-alt)}
tbody td{padding:3px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px;height:36px;border-right:1px solid transparent}
tbody tr[aria-selected=true]{background:linear-gradient(var(--sel-top),var(--sel-bot));color:#fff}
tbody tr[aria-selected=true] .sub{color:#e3ecfa}
.proj{display:flex;align-items:center;gap:8px;min-width:0}
.thumb{flex:none;width:44px;height:28px;background:#222 center/cover no-repeat;border:1px solid rgba(0,0,0,.25)}
.proj div{min-width:0}
.proj b{display:block;font-weight:400;overflow:hidden;text-overflow:ellipsis}
.sub{display:block;font-size:10.5px;color:var(--list-dim);overflow:hidden;text-overflow:ellipsis}
.nowplaying{display:inline-block;width:10px;margin-right:2px;color:#2e66c4}
tr[aria-selected=true] .nowplaying{color:#fff}
.col-time{width:62px}.col-by{width:20%}.col-sec{width:17%}.col-on{width:17%}
.none{padding:40px 20px;text-align:center;color:var(--list-dim)}

/* ---------- Grid ---------- */
.grid{display:none;overflow:auto;padding:16px;background:var(--list);grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:18px 16px;align-content:start}
.grid-only .grid{display:grid}
.grid-only .flow{display:none}
.tile{border:0;background:none;padding:0;text-align:left;cursor:pointer;color:var(--list-ink)}
.tile .art{aspect-ratio:2.39/1;background:#222 center/cover no-repeat;box-shadow:0 2px 6px rgba(0,0,0,.35);border:1px solid rgba(0,0,0,.25)}
.tile[aria-selected=true] .art{outline:3px solid #5d86c8;outline-offset:2px}
.tile b{display:block;font-weight:700;font-size:11.5px;margin-top:7px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile span{display:block;font-size:11px;color:var(--list-dim)}

/* ---------- Bio / Contact panel ---------- */
.panel{display:none;overflow:auto;background:var(--panel);color:var(--panel-ink);padding:28px clamp(18px,4vw,48px) 40px;-webkit-user-select:text;user-select:text}
.panel-only .panel{display:block}
.panel-only .flow,.panel-only .grid{display:none}
.card{max-width:560px;margin:0 auto;background:var(--list);border:1px solid var(--list-line);border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.18);overflow:hidden}
.card header{display:flex;gap:16px;align-items:center;padding:18px 20px;background:linear-gradient(var(--chrome-top),var(--chrome-bot));border-bottom:1px solid var(--chrome-line)}
.card header .pic{width:64px;height:64px;border-radius:6px;background:#333 center/cover no-repeat;flex:none;border:1px solid rgba(0,0,0,.3)}
.card header h2{margin:0;font-size:17px}
.card header p{margin:3px 0 0;color:var(--list-dim);font-size:12px}
.card dl{margin:0;padding:12px 20px 18px;display:grid;grid-template-columns:110px 1fr;gap:8px 12px;font-size:12.5px}
.card dt{color:var(--list-dim);text-align:right}
.card dd{margin:0;overflow-wrap:anywhere}
.card dd a{color:#2e66c4}
:root[data-theme=dark] .card dd a{color:#8cb2f0}
.card .about{padding:0 20px 18px;font-size:12.5px;white-space:pre-line}
.btnp{border:1px solid var(--btn-line);border-radius:11px;background:linear-gradient(var(--btn-top),var(--btn-bot));padding:1px 10px;cursor:pointer;font-size:11px;color:var(--btn-ink);margin-left:6px}

/* ---------- Status bar ---------- */
.status{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;height:24px;padding:0 10px;padding-bottom:env(safe-area-inset-bottom);box-sizing:content-box;background:linear-gradient(var(--chrome-top),var(--status));border-top:1px solid var(--chrome-line);color:var(--status-ink);font-size:11px}
.status .mid{text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status .r{display:flex;justify-content:flex-end}
.toggle{display:flex;align-items:center;gap:5px;border:0;background:none;padding:2px 4px;cursor:pointer;color:inherit;font-size:11px}
.toggle svg{width:12px;height:12px;fill:currentColor}
.exit{font-size:11px;text-decoration:none;opacity:.8}
.exit:hover{opacity:1;text-decoration:underline}

/* ---------- Pop-up player window ---------- */
.win{position:fixed;z-index:5000;width:min(640px,calc(100vw - 24px));background:linear-gradient(var(--win-top),var(--win-bot));border:1px solid #6a6a6a;border-radius:7px 7px 5px 5px;box-shadow:0 18px 50px rgba(0,0,0,.55),0 0 0 .5px rgba(0,0,0,.4);overflow:hidden;display:none;color:var(--btn-ink)}
.win.open{display:block;animation:pop .22s cubic-bezier(.2,.8,.3,1.2)}
@keyframes pop{from{transform:scale(.86);opacity:0}}
.win .tb{height:22px;display:flex;align-items:center;gap:8px;padding:0 8px;cursor:move;font-size:11.5px;font-weight:700;touch-action:none}
.win .tb span{flex:1;text-align:center;margin-right:40px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:12px;height:12px;border-radius:50%;border:1px solid #9a2b22;background:radial-gradient(circle at 50% 35%,#ffb3a8,#e0463a 60%,#b8281d);padding:0;cursor:pointer;flex:none}
.win video{display:block;width:100%;aspect-ratio:2.39/1;background:#000;object-fit:contain}
.win .ctl{padding:6px 10px 8px}
.win .row1{display:grid;grid-template-columns:38px 1fr 38px;gap:8px;align-items:center;font-size:10px}
.win .row1 span:last-child{text-align:right}
.win .row1 input{width:100%}
.win .row2{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;margin-top:4px}
.win .row2 .mid{display:flex;gap:6px}
.win .row2 .r{display:flex;justify-content:flex-end;align-items:center;gap:8px}
.win .round{width:24px;height:24px}
.win .round.big{width:30px;height:30px}
.win .round svg{width:10px;height:10px}
.win .round.big svg{width:12px;height:12px}
.sq{width:22px;height:18px;border:1px solid var(--btn-line);border-radius:3px;background:linear-gradient(var(--btn-top),var(--btn-bot));display:grid;place-items:center;cursor:pointer;padding:0}
.sq svg{width:11px;height:11px;fill:none;stroke:currentColor;stroke-width:1.8}
#wvol{width:70px}

/* ---------- Boot screen ---------- */
.boot{position:fixed;inset:0;z-index:9000;display:grid;place-items:center;background:#000;color:#cfcfcf;transition:opacity .5s}
.boot.done{opacity:0;pointer-events:none}
.boot div{text-align:center;font-size:12px}
.boot b{display:block;font-size:20px;color:#fff;margin-bottom:14px;letter-spacing:-.01em}
.boot .bar2{width:180px;height:10px;border:1px solid #555;border-radius:6px;margin:0 auto;overflow:hidden;background:#111}
.boot .bar2 i{display:block;height:100%;width:0;background:linear-gradient(#e8e8e8,#8d8d8d);transition:width .5s}


/* ---------- Glossy details everywhere ---------- */
.round{position:relative;overflow:hidden}
.round::after{content:"";position:absolute;left:12%;right:12%;top:2px;height:45%;border-radius:50% 50% 40% 40%;background:linear-gradient(rgba(255,255,255,.75),rgba(255,255,255,0));pointer-events:none}
:root[data-theme=dark] .round::after{background:linear-gradient(rgba(255,255,255,.28),rgba(255,255,255,0))}
.btnp.aqua{border-color:#2a5cb8;color:#fff;background:linear-gradient(#a6cdfb 0,#5b9cf1 48%,#3d84ec 52%,#8cc0ff 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.6);text-shadow:0 1px 1px rgba(0,0,0,.25);animation:throb 1.6s ease-in-out infinite}
@keyframes throb{50%{filter:brightness(1.12) saturate(.85)}}
.panel{background:repeating-linear-gradient(var(--panel) 0 2px,var(--stripe) 2px 4px)}
:root{--stripe:#f8f8f8}
:root[data-theme=dark]{--stripe:#252525}
/* Aqua scrollbars */
.list::-webkit-scrollbar,.grid::-webkit-scrollbar,.panel::-webkit-scrollbar,.src::-webkit-scrollbar{width:15px;height:15px}
.list::-webkit-scrollbar-track,.grid::-webkit-scrollbar-track,.panel::-webkit-scrollbar-track,.src::-webkit-scrollbar-track{background:linear-gradient(90deg,#cdcdcd,#f3f3f3 45%,#e4e4e4);box-shadow:inset 1px 0 2px rgba(0,0,0,.18)}
.list::-webkit-scrollbar-thumb,.grid::-webkit-scrollbar-thumb,.panel::-webkit-scrollbar-thumb,.src::-webkit-scrollbar-thumb{border-radius:8px;border:1px solid #2a5cb8;background:linear-gradient(90deg,#2d6ddc,#76aefc 38%,#b2d6ff 52%,#4b8bf0 70%,#2f6fde)}
:root[data-theme=dark] .list::-webkit-scrollbar-track,:root[data-theme=dark] .grid::-webkit-scrollbar-track,:root[data-theme=dark] .panel::-webkit-scrollbar-track,:root[data-theme=dark] .src::-webkit-scrollbar-track{background:linear-gradient(90deg,#1b1b1b,#2b2b2b)}

(()=>{
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const PLAY='<path d="M7 4.5v15L20 12z"/>',PAUSE='<path d="M6 4.5h4.5v15H6zM13.5 4.5H18v15h-4.5z"/>';
const fmt=s=>{if(!isFinite(s)||s<0)s=0;s=Math.round(s);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');};
const abs=u=>{try{return new URL(u,location.origin+'/').href;}catch{return u;}};
const store={get(k){try{return localStorage.getItem(k);}catch{return null;}},set(k,v){try{localStorage.setItem(k,v);}catch{}}};

/* ---------- State ---------- */
let C={name:'Tanner Hill Dodd',bio1:'',bio2:'',email:'',socials:{},clips:[],archive:[]};
let all=[];          // every clip with metadata
let shown=[];        // clips in the current source, filtered by search
let source='featured', view='flow', cur=0, pos=0, sortK=null, sortDir=1;
let playing=null;    // {idx, el, where:'flow'|'win'}
const durs={};

/* ---------- Theme ---------- */
function setTheme(t){document.documentElement.dataset.theme=t;$('theme').setAttribute('aria-pressed',t==='dark');$('theme').querySelector('span').textContent=t==='dark'?'Light':'Dark';document.querySelector('meta[name=theme-color]').content=t==='dark'?'#2b2b2b':'#cfcfcf';store.set('retro-theme',t);}
setTheme(store.get('retro-theme')||'light');
$('theme').onclick=()=>setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');

/* ---------- Load content ---------- */
async function load(){
  $('boot-bar').style.width='35%';
  let data=null;
  for(const u of ['/api/content','/content.json']){
    try{const r=await fetch(u,{cache:'no-store'});if(r.ok){data=await r.json();break;}}catch{}
  }
  if(data)C=Object.assign(C,data,{socials:Object.assign({},data.socials)});
  $('boot-bar').style.width='75%';
  const nm=C.name||'Tanner Hill Dodd';
  $('boot-name').textContent=nm;document.title=nm+' · Library';
  all=[];
  (C.clips||[]).forEach((c,i)=>all.push(mk(c,i,'Featured Work')));
  (C.archive||[]).forEach((c,i)=>all.push(mk(c,i,'Archive')));
  all.forEach(c=>probe(c));
  buildSources();
  setSource(location.hash==='#archive'?'archive':location.hash==='#bio'?'bio':location.hash==='#contact'?'contact':'featured');
  idle();
  setTimeout(()=>{$('boot-bar').style.width='100%';setTimeout(()=>$('boot').classList.add('done'),380);},250);
}
function mk(c,i,sec){
  const n=String(i+1).padStart(2,'0');
  return {src:abs(c.src),poster:c.poster?abs(c.poster):'',title:c.title||(sec==='Archive'?'Archived clip '+n:'Clip '+n),info:c.info||'',sec,on:sec==='Archive'?(c.archived?'Until '+c.archived:'Archived'):'Main page',by:C.name||'Tanner Hill Dodd',key:sec+i};
}
/* Durations (and a still when a clip has no poster) */
function probe(c){
  const v=document.createElement('video');v.preload='metadata';v.muted=true;v.playsInline=true;v.crossOrigin='anonymous';
  v.onloadedmetadata=()=>{durs[c.key]=v.duration;c.dur=v.duration;refreshTimes();if(!c.poster)v.currentTime=Math.min(.5,v.duration/2);};
  v.onseeked=()=>{if(c.poster)return;try{const cv=document.createElement('canvas');cv.width=480;cv.height=Math.round(480*v.videoHeight/v.videoWidth)||200;cv.getContext('2d').drawImage(v,0,0,cv.width,cv.height);c.poster=cv.toDataURL('image/jpeg',.8);renderAll(true);}catch{}};
  v.src=c.src;
}
function refreshTimes(){document.querySelectorAll('[data-dur]').forEach(td=>{const c=all.find(x=>x.key===td.dataset.dur);if(c&&c.dur)td.textContent=fmt(c.dur);});updateStat();}

/* ---------- Sources ---------- */
const ICONS={
  featured:'<svg viewBox="0 0 16 16"><path d="m8 1.8 1.9 4 4.3.5-3.2 3 .9 4.3L8 11.4l-3.9 2.2.9-4.3-3.2-3 4.3-.5z" fill="currentColor" stroke="none"/></svg>',
  all:'<svg viewBox="0 0 16 16"><rect x="2" y="3" width="12" height="10" rx="1"/><path d="M2 6h12"/></svg>',
  archive:'<svg viewBox="0 0 16 16"><rect x="2" y="3" width="12" height="3"/><path d="M3 6v7h10V6M6.5 8.5h3"/></svg>',
  recent:'<svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="6"/><path d="M8 4.5V8l2.5 1.5"/></svg>',
  bio:'<svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="6"/><path d="M8 7v4.5M8 4.6v.2"/></svg>',
  contact:'<svg viewBox="0 0 16 16"><rect x="2" y="3.5" width="12" height="9" rx="1"/><path d="m2.5 4.5 5.5 4.5 5.5-4.5"/></svg>',
  ig:'<svg viewBox="0 0 16 16"><rect x="2.5" y="2.5" width="11" height="11" rx="3"/><circle cx="8" cy="8" r="2.6"/></svg>',
  tt:'<svg viewBox="0 0 16 16"><path d="M9 2.5v8a2.5 2.5 0 1 1-2.5-2.5M9 2.5c.4 1.8 1.7 3 3.5 3"/></svg>',
  li:'<svg viewBox="0 0 16 16"><rect x="2.5" y="2.5" width="11" height="11" rx="1.5"/><path d="M5.5 7v4M5.5 5v.1M8 11V7m0 1.8c0-1 .8-1.8 1.8-1.8s1.7.8 1.7 1.8V11"/></svg>',
  exit:'<svg viewBox="0 0 16 16"><path d="M9.5 3.5h3.5v9H9.5M7 5 4 8l3 3M4 8h7"/></svg>'
};
function buildSources(){
  const s=C.socials||{};const hasArch=(C.archive||[]).length>0;
  const groups=[
    ['Library',[['featured','Featured Work'],['all','All Clips'],...(hasArch?[['archive','Archive']]:[])]],
    ['Playlists',[['recent','Recently Added']]],
    [C.name||'Tanner Hill Dodd',[['bio','Bio'],['contact','Contact']]],
    ['Elsewhere',[...(s.instagram?[['ig','Instagram',s.instagram]]:[]),...(s.tiktok?[['tt','TikTok',s.tiktok]]:[]),...(s.linkedin?[['li','LinkedIn',s.linkedin]]:[]),['exit','Main site','/']]]
  ];
  $('src').innerHTML=groups.map(([h,items])=>`<h3>${esc(h)}</h3>`+items.map(([k,l,u])=>u?`<a href="${esc(u)}"${u==='/'?'':' target="_blank" rel="noopener"'}>${ICONS[k]}${esc(l)}</a>`:`<button type="button" data-s="${k}">${ICONS[k]}${esc(l)}</button>`).join('')).join('');
  $('mtabs').innerHTML=[['featured','Featured'],['all','All'],...(hasArch?[['archive','Archive']]:[]),['bio','Bio'],['contact','Contact']].map(([k,l])=>`<button type="button" data-s="${k}">${l}</button>`).join('')+'<a href="/">Exit</a>';
  document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>setSource(b.dataset.s));
}
function setSource(s){
  source=s;
  document.querySelectorAll('[data-s]').forEach(b=>b.setAttribute('aria-current',b.dataset.s===s));
  if(s==='bio'||s==='contact'){renderPanel();applyView();updateStat();history.replaceState(null,'','#'+s);return;}
  history.replaceState(null,'',s==='archive'?'#archive':location.pathname);
  filter();cur=0;pos=0;applyView();renderAll();
}
function filter(){
  const q=$('q').value.trim().toLowerCase();
  let list=source==='archive'?all.filter(c=>c.sec==='Archive'):source==='featured'?all.filter(c=>c.sec!=='Archive'):source==='recent'?all.filter(c=>c.sec!=='Archive').slice(0,5):all.slice();
  if(q)list=list.filter(c=>(c.title+' '+c.info+' '+c.sec).toLowerCase().includes(q));
  if(sortK){list=list.slice().sort((a,b)=>{const x=sortK==='dur'?(a.dur||0):String(a[sortK]).toLowerCase(),y=sortK==='dur'?(b.dur||0):String(b[sortK]).toLowerCase();return (x>y?1:x<y?-1:0)*sortDir;});}
  shown=list;
}
$('q').oninput=()=>{if(source==='bio'||source==='contact')setSource('all');else{filter();cur=Math.min(cur,Math.max(0,shown.length-1));pos=cur;renderAll();}};
document.querySelectorAll('thead th').forEach(th=>th.onclick=()=>{
  const k=th.dataset.k;if(sortK===k)sortDir*=-1;else{sortK=k;sortDir=1;}
  document.querySelectorAll('thead th').forEach(t=>t.toggleAttribute('aria-sort',t===th));
  const key=shown[cur]&&shown[cur].key;filter();cur=Math.max(0,shown.findIndex(c=>c.key===key));pos=cur;renderAll();
});

/* ---------- Views ---------- */
function applyView(){
  const panel=source==='bio'||source==='contact';
  const el=$('content');
  el.className='content'+(panel?' panel-only':view==='list'?' list-only':view==='grid'?' grid-only':'');
  document.querySelectorAll('.seg button').forEach(b=>b.setAttribute('aria-pressed',!panel&&b.dataset.v===view));
  if(!panel&&view==='flow')requestAnimationFrame(layoutFlow);
}
document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{view=b.dataset.v;store.set('retro-view',view);if(source==='bio'||source==='contact')setSource('featured');else{applyView();renderAll();}});
view=store.get('retro-view')||'flow';

function renderAll(keepPlay){
  if(!keepPlay)stopFlowVideo();
  renderRows();renderGrid();buildFlow();updateCap();updateStat();
}

/* ---------- List ---------- */
function renderRows(){
  const tb=$('rows');
  if(!shown.length){tb.innerHTML=`<tr><td colspan="5" class="none">${$('q').value?'No clips match your search.':'Nothing here yet.'}</td></tr>`;return;}
  tb.innerHTML=shown.map((c,i)=>`<tr data-i="${i}" aria-selected="${i===cur}"><td><div class="proj"><span class="thumb" style="background-image:url('${esc(c.poster)}')"></span><div><b>${playing&&playing.key===c.key?'<span class="nowplaying">▶</span>':''}${esc(c.title)}</b>${c.info?`<span class="sub">${esc(c.info)}</span>`:''}</div></div></td><td data-dur="${c.key}">${c.dur?fmt(c.dur):'--:--'}</td><td class="by">${esc(c.by)}</td><td>${esc(c.sec)}</td><td class="on">${esc(c.on)}</td></tr>`).join('');
  tb.querySelectorAll('tr[data-i]').forEach(tr=>{
    const i=+tr.dataset.i;
    tr.onclick=()=>select(i,true);
    tr.ondblclick=()=>{select(i);openWin(i);};
  });
}
function markRows(){document.querySelectorAll('#rows tr[data-i]').forEach(tr=>tr.setAttribute('aria-selected',+tr.dataset.i===cur));document.querySelectorAll('#grid .tile').forEach(t=>t.setAttribute('aria-selected',+t.dataset.i===cur));}

/* ---------- Grid ---------- */
function renderGrid(){
  $('grid').innerHTML=shown.length?shown.map((c,i)=>`<button class="tile" type="button" data-i="${i}" aria-selected="${i===cur}"><div class="art" style="background-image:url('${esc(c.poster)}')"></div><b>${esc(c.title)}</b><span>${esc(c.info||c.sec)}</span></button>`).join(''):'<p class="none">Nothing here yet.</p>';
  $('grid').querySelectorAll('.tile').forEach(t=>t.onclick=()=>{select(+t.dataset.i);openWin(+t.dataset.i);});
}

/* ---------- Cover flow ---------- */
let covers=[],cw=0,ch=0;
function buildFlow(){
  const st=$('stage');st.innerHTML='';covers=[];
  if(!shown.length){st.innerHTML='<div class="empty-flow">Nothing here yet.</div>';$('thumb').style.display='none';return;}
  $('thumb').style.display='';
  shown.forEach((c,i)=>{
    const d=document.createElement('div');d.className='cover';
    d.innerHTML=`<div class="face" style="background-image:url('${esc(c.poster)}')"></div><div class="refl" style="background-image:url('${esc(c.poster)}')"></div><div class="shade"></div>`;
    d.onclick=e=>{if(moved)return;if(i===cur){if(e.detail>1){stopFlowVideo();openWin(i);}else toggleFlowPlay();}else select(i,true);};
    st.appendChild(d);covers.push(d);
  });
  layoutFlow();
}
function layoutFlow(){
  const st=$('stage');const W=st.clientWidth,H=st.clientHeight;if(!W||!H)return;
  const narrow=W<560;
  cw=Math.min(W*(narrow?.62:.5),H*.66*2.39,900);ch=cw/2.39;
  const top=Math.max(10,(H-ch)*.52-ch*.1);
  covers.forEach((el,i)=>{el.style.width=cw+'px';el.style.height=ch+'px';el.style.marginLeft=-cw/2+'px';el.style.top=top+'px';});
  place();
}
function place(){
  const n=covers.length;if(!n)return;
  const side=cw*.62,step=cw*(window.innerWidth<560?.16:.2);
  covers.forEach((el,i)=>{
    const d=i-pos,a=Math.min(Math.abs(d),1),s=Math.sign(d);
    if(Math.abs(d)>9){el.style.visibility='hidden';return;}el.style.visibility='';
    const x=s*(a*side+Math.max(Math.abs(d)-1,0)*step);
    const rot=-s*a*68,z=-a*cw*.42;
    el.style.transform=`translate3d(${x}px,0,${z}px) rotateY(${rot}deg)`;
    el.style.zIndex=String(1000-Math.round(Math.abs(d)*10));
    el.querySelector('.shade').style.opacity=String(Math.min(.55,Math.abs(d)*.18));
  });
  const th=$('thumb'),tr=$('scroller').clientWidth-2,tw=Math.max(28,tr/Math.max(n,1));
  th.style.width=tw+'px';th.style.left=(1+(n>1?pos/(n-1):0)*(tr-tw))+'px';
}
/* smooth glide toward the chosen cover */
let raf=0;
function glide(){
  cancelAnimationFrame(raf);
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const tick=()=>{const diff=cur-pos;if(reduce||Math.abs(diff)<.002){pos=cur;place();return;}pos+=diff*.16;place();raf=requestAnimationFrame(tick);};
  tick();
}
function select(i,keep){
  if(!shown.length)return;
  i=Math.max(0,Math.min(shown.length-1,i));
  if(i!==cur&&playing&&playing.where==='flow')stopFlowVideo();
  cur=i;markRows();updateCap();glide();
  if(!playing)idle();
  const tr=document.querySelector(`#rows tr[data-i="${i}"]`);if(tr)tr.scrollIntoView({block:'nearest'});
  updateStat();
}
function updateCap(){const c=shown[cur];$('cap').innerHTML=c?`${esc(c.title)}${c.info?`<small>${esc(c.info)}</small>`:''}`:'';}
$('fl').onclick=()=>select(cur-1);$('fr').onclick=()=>select(cur+1);

/* drag / swipe / wheel */
let dragX=null,startPos=0,moved=false,lastX=0,lastT=0,vel=0;
const flow=$('flow');
flow.addEventListener('pointerdown',e=>{if(e.target.closest('.arrow,.scroller'))return;dragX=e.clientX;startPos=pos;moved=false;vel=0;lastX=e.clientX;lastT=performance.now();cancelAnimationFrame(raf);});
window.addEventListener('pointermove',e=>{
  if(dragX===null)return;const dx=e.clientX-dragX;if(Math.abs(dx)>6)moved=true;if(!moved)return;
  const now=performance.now();vel=(e.clientX-lastX)/Math.max(1,now-lastT);lastX=e.clientX;lastT=now;
  pos=Math.max(-.4,Math.min(shown.length-.6,startPos-dx/(cw*.32||100)));place();
});
window.addEventListener('pointerup',()=>{
  if(dragX===null)return;dragX=null;
  if(moved){const target=Math.round(pos-vel*2.2);select(target);setTimeout(()=>moved=false,0);}
  else{pos=cur;}
});
let wheelAcc=0,wheelT=0;
flow.addEventListener('wheel',e=>{
  const d=Math.abs(e.deltaX)>Math.abs(e.deltaY)?e.deltaX:e.deltaY;if(!d)return;e.preventDefault();
  wheelAcc+=d;const now=Date.now();
  if(Math.abs(wheelAcc)>60||now-wheelT>250&&Math.abs(wheelAcc)>8){select(cur+Math.sign(wheelAcc));wheelAcc=0;wheelT=now;}
},{passive:false});
/* scrollbar */
const sc=$('scroller');
function scrollTo(e){const r=sc.getBoundingClientRect();const f=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width));select(Math.round(f*(shown.length-1)));}
sc.addEventListener('pointerdown',e=>{scrollTo(e);sc.setPointerCapture(e.pointerId);sc.onpointermove=scrollTo;});
sc.addEventListener('pointerup',()=>sc.onpointermove=null);
addEventListener('resize',()=>layoutFlow());
$('hint').textContent=matchMedia('(pointer:coarse)').matches?'Swipe to browse · Tap the middle clip to play':'Drag, scroll or use ← → · Click the middle clip to play';
setTimeout(()=>$('hint').style.opacity=0,5000);

/* splitter between cover flow and list */
(()=>{const sp=$('split');let y0=null,h0=0,tot=0;
  sp.addEventListener('pointerdown',e=>{const f=$('flow');y0=e.clientY;h0=f.clientHeight;tot=$('content').clientHeight-7;sp.setPointerCapture(e.pointerId);});
  sp.addEventListener('pointermove',e=>{if(y0===null)return;const h=Math.max(120,Math.min(tot-60,h0+e.clientY-y0));$('content').style.gridTemplateRows=view==='flow'?`${h}px 7px minmax(0,1fr)`:'';layoutFlow();});
  sp.addEventListener('pointerup',()=>y0=null);
})();

/* ---------- Playback ---------- */
let flowVid=null;
function activeVideo(){return playing?playing.el:null;}
function toggleFlowPlay(){
  if(playing&&playing.where==='flow'){const v=playing.el;v.paused?v.play():v.pause();return;}
  playFlow(cur);
}
function playFlow(i){
  stopAll();
  const c=shown[i];if(!c||!covers[i])return;
  const v=document.createElement('video');v.className='vid';v.src=c.src;v.playsInline=true;v.setAttribute('playsinline','');v.volume=+$('vol').value;v.preload='auto';
  covers[i].querySelector('.face').appendChild(v);covers[i].classList.add('playing');
  flowVid=v;playing={key:c.key,idx:i,el:v,where:'flow'};
  hook(v,c);
  v.onended=()=>{next(true);};
  v.play().catch(()=>{v.muted=true;v.play().catch(()=>{});});
  renderRows();
}
function stopFlowVideo(){
  if(flowVid){flowVid.pause();flowVid.removeAttribute('src');flowVid.load();flowVid.remove();flowVid=null;}
  covers.forEach(c=>c.classList.remove('playing'));
  if(playing&&playing.where==='flow'){playing=null;idle();setIcons(false);}
}
function stopAll(){stopFlowVideo();if(playing&&playing.where==='win'){$('wv').pause();}playing=null;setIcons(false);}
function hook(v,c){
  v.ontimeupdate=()=>{if(activeVideo()!==v)return;lcdTime(v);if(v===$('wv'))winTime();};
  v.onplay=()=>{if(activeVideo()===v)setIcons(true);};
  v.onpause=()=>{if(activeVideo()===v)setIcons(false);};
  v.onloadedmetadata=()=>{if(!c.dur){c.dur=v.duration;refreshTimes();}if(activeVideo()===v)lcdTime(v);};
  $('lcd').classList.remove('idle');$('lcd-t').textContent=c.title;$('lcd-s').textContent=c.info||c.by;
}
function setIcons(on){$('play-ico').innerHTML=on?PAUSE:PLAY;$('w-ico').innerHTML=on?PAUSE:PLAY;$('play').setAttribute('aria-label',on?'Pause':'Play');$('w-play').setAttribute('aria-label',on?'Pause':'Play');}
function lcdTime(v){const d=v.duration||0,t=v.currentTime||0;$('lcd-a').textContent=fmt(t);$('lcd-b').textContent='-'+fmt(d-t);$('lcd-fill').style.width=(d?t/d*100:0)+'%';}
function idle(){
  if(playing)return;
  const c=shown[cur];$('lcd').classList.add('idle');
  $('lcd-t').textContent=c?c.title:(C.name||'Tanner Hill Dodd');
  $('lcd-s').textContent=c?(c.info||C.name||''):(C.bio1||'');
}
$('lcd-track').addEventListener('pointerdown',e=>{const v=activeVideo();if(!v||!v.duration)return;const r=e.currentTarget.getBoundingClientRect();v.currentTime=(e.clientX-r.left)/r.width*v.duration;});
$('play').onclick=()=>{
  const v=activeVideo();if(v){v.paused?v.play():v.pause();return;}
  if(source==='bio'||source==='contact'){setSource('featured');}
  if(view==='flow'&&getComputedStyle($('flow')).display!=='none')playFlow(cur);else openWin(cur);
};
function next(auto){
  if(!shown.length)return;const where=playing&&playing.where;
  const i=cur+1>=shown.length?(auto?0:cur):cur+1;
  if(where==='win'){select(i);openWin(i);}else if(where==='flow'){select(i);setTimeout(()=>playFlow(i),260);}else select(i);
}
function prev(){
  const v=activeVideo();if(v&&v.currentTime>2){v.currentTime=0;return;}
  const where=playing&&playing.where;const i=Math.max(0,cur-1);
  if(where==='win'){select(i);openWin(i);}else if(where==='flow'){select(i);setTimeout(()=>playFlow(i),260);}else select(i);
}
$('next').onclick=()=>next();$('prev').onclick=prev;
$('vol').oninput=e=>{const v=+e.target.value;$('wvol').value=v;document.querySelectorAll('video.vid,#wv').forEach(x=>{x.volume=v;x.muted=false;});store.set('retro-vol',v);};
$('wvol').oninput=e=>{$('vol').value=e.target.value;$('vol').oninput({target:e.target});};
{const v=store.get('retro-vol');if(v!==null){$('vol').value=v;$('wvol').value=v;}}

/* ---------- Pop-up window player ---------- */
const win=$('win'),wv=$('wv');
function openWin(i){
  const c=shown[i];if(!c)return;
  stopAll();
  wv.src=c.src;if(c.poster)wv.poster=c.poster;wv.volume=+$('vol').value;wv.muted=false;
  playing={key:c.key,idx:i,el:wv,where:'win'};hook(wv,c);
  wv.onended=()=>next(true);
  $('win-t').textContent=c.title+(c.info?' · '+c.info:'');
  if(!win.classList.contains('open')){
    win.classList.add('open');
    const r=win.getBoundingClientRect();
    win.style.left=Math.max(12,(innerWidth-r.width)/2)+'px';win.style.top=Math.max(12,(innerHeight-r.height)/2-20)+'px';
  }
  wv.play().catch(()=>{wv.muted=true;wv.play().catch(()=>{});});
  renderRows();
}
function closeWin(){win.classList.remove('open');wv.pause();wv.removeAttribute('src');wv.load();if(playing&&playing.where==='win'){playing=null;setIcons(false);idle();renderRows();}}
$('win-x').onclick=closeWin;
$('w-play').onclick=()=>{wv.paused?wv.play():wv.pause();};
$('w-next').onclick=()=>next();$('w-prev').onclick=prev;
$('w-fs').onclick=()=>{if(wv.requestFullscreen)wv.requestFullscreen();else if(wv.webkitEnterFullscreen)wv.webkitEnterFullscreen();};
$('w-seek').oninput=e=>{if(wv.duration)wv.currentTime=e.target.value/1000*wv.duration;};
function winTime(){const d=wv.duration||0,t=wv.currentTime||0;$('w-a').textContent=fmt(t);$('w-b').textContent='-'+fmt(d-t);$('w-seek').value=d?t/d*1000:0;}
wv.onclick=()=>{wv.paused?wv.play():wv.pause();};
(()=>{const tb=$('win-tb');let ox=null,oy=0;
  tb.addEventListener('pointerdown',e=>{if(e.target.closest('.dot'))return;const r=win.getBoundingClientRect();ox=e.clientX-r.left;oy=e.clientY-r.top;tb.setPointerCapture(e.pointerId);});
  tb.addEventListener('pointermove',e=>{if(ox===null)return;const r=win.getBoundingClientRect();win.style.left=Math.max(-r.width+80,Math.min(innerWidth-80,e.clientX-ox))+'px';win.style.top=Math.max(0,Math.min(innerHeight-30,e.clientY-oy))+'px';});
  tb.addEventListener('pointerup',()=>ox=null);
})();

/* ---------- Bio / Contact ---------- */
function renderPanel(){
  const s=C.socials||{},nm=C.name||'Tanner Hill Dodd';
  const pic=C.portrait?abs(C.portrait):(all[0]&&all[0].poster)||'';
  const head=`<header><div class="pic" style="background-image:url('${esc(pic)}')"></div><div><h2>${esc(nm)}</h2><p>${esc(C.bio1||'')}</p></div></header>`;
  const links=[['Instagram',s.instagram],['TikTok',s.tiktok],['LinkedIn',s.linkedin]].filter(x=>x[1]);
  const handle=u=>{try{const p=new URL(u).pathname.replace(/\/+$/,'').split('/').pop();return p.startsWith('@')?p:'@'+p;}catch{return u;}};
  let body;
  if(source==='bio'){
    body=`<dl><dt>Name</dt><dd>${esc(nm)}</dd>${C.bio1?`<dt>Studies</dt><dd>${esc(C.bio1)}</dd>`:''}${C.bio2?`<dt>Where</dt><dd>${esc(C.bio2)}</dd>`:''}<dt>Library</dt><dd>${all.filter(c=>c.sec!=='Archive').length} clips on the main page${all.some(c=>c.sec==='Archive')?`, ${all.filter(c=>c.sec==='Archive').length} in the archive`:''}</dd>${C.updated?`<dt>Last updated</dt><dd>${esc(C.updated)}</dd>`:''}${C.worked?`<dt>Worked with</dt><dd>${esc(C.worked)}</dd>`:''}</dl>${C.about?`<div class="about">${esc(C.about)}</div>`:''}`;
  }else{
    body=`<dl>${C.email?`<dt>Email</dt><dd><a href="mailto:${esc(C.email)}">${esc(C.email)}</a><button class="btnp aqua" type="button" id="cp">Copy</button></dd>`:''}${links.map(([l,u])=>`<dt>${l}</dt><dd><a href="${esc(u)}" target="_blank" rel="noopener">${esc(l==='LinkedIn'?'Tanner Dodd':handle(u))}</a></dd>`).join('')}${C.bio2?`<dt>Based in</dt><dd>${esc(C.bio2)}</dd>`:''}</dl>`;
  }
  $('panel').innerHTML=`<div class="card">${head}${body}</div>`;
  const cp=$('cp');if(cp)cp.onclick=async()=>{try{await navigator.clipboard.writeText(C.email);cp.textContent='Copied';}catch{cp.textContent='Press and hold to copy';}};
}

/* ---------- Status ---------- */
function updateStat(){
  const nm=C.name||'Tanner Hill Dodd';
  if(source==='bio'||source==='contact'){$('stat').textContent=nm;return;}
  const total=shown.reduce((a,c)=>a+(c.dur||0),0);
  $('stat').textContent=`${nm} · ${shown.length} ${shown.length===1?'clip':'clips'}${total?' · '+fmt(total)+' total':''}${shown.length?` · ${cur+1}/${shown.length}`:''}`;
}

/* ---------- Keyboard ---------- */
addEventListener('keydown',e=>{
  if(e.target.matches('input[type=search],input[type=text]'))return;
  if(e.key==='ArrowRight'||(e.key==='ArrowDown'&&view!=='flow')){e.preventDefault();select(cur+1);}
  else if(e.key==='ArrowLeft'||(e.key==='ArrowUp'&&view!=='flow')){e.preventDefault();select(cur-1);}
  else if(e.key===' '&&!e.target.closest('button')){e.preventDefault();$('play').click();}
  else if(e.key==='Enter'&&!e.target.closest('button,a')){openWin(cur);}
  else if(e.key==='Escape'&&win.classList.contains('open'))closeWin();
});

/* ---------- Desktop: menu bar, traffic lights, dock ---------- */
const exitHref=document.querySelector('.exit').getAttribute('href');
document.querySelectorAll('[data-exit]').forEach(a=>{a.setAttribute('href',exitHref);const t=document.querySelector('.exit').getAttribute('target');if(t){a.target=t;a.rel='noopener';}});
$('win-z').onclick=()=>$('w-fs').click();
function nudgeVol(d){const v=Math.max(0,Math.min(1,+$('vol').value+d));$('vol').value=v;$('vol').oninput({target:$('vol')});}
function doAct(a){
  const [k,arg]=a.split(':');
  if(k==='go'){restore();setSource(arg);}
  else if(k==='view'){restore();const b=document.querySelector(`.seg button[data-v="${arg}"]`);if(b)b.click();}
  else if(k==='theme')$('theme').click();
  else if(k==='open')openWin(cur);
  else if(k==='closewin')closeWin();
  else if(k==='copymail'){try{navigator.clipboard.writeText(C.email||'');}catch{}}
  else if(k==='zoom')toggleZoom();
  else if(k==='play')$('play').click();
  else if(k==='next')next();
  else if(k==='prev')prev();
  else if(k==='volup')nudgeVol(.1);
  else if(k==='voldown')nudgeVol(-.1);
  else if(k==='restore')restore(true);
  else if(k==='help'){restore();$('hint').style.opacity=1;setTimeout(()=>$('hint').style.opacity=0,4000);}
  else if(k==='url'){window.open(arg+(a.slice(k.length+arg.length+1)),'_blank','noopener');}
}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-do]');if(!t)return;
  closeMenus();doAct(t.dataset.do);
});
/* menus open on click, then follow the pointer across the bar */
const menus=[...document.querySelectorAll('.m')];
function closeMenus(){menus.forEach(m=>m.classList.remove('open'));}
menus.forEach(m=>{
  const b=m.firstElementChild;
  b.addEventListener('mousedown',e=>{e.preventDefault();const was=m.classList.contains('open');closeMenus();if(!was){m.classList.add('open');syncChecks();}});
  b.addEventListener('mouseenter',()=>{if(menus.some(x=>x.classList.contains('open'))&&!m.classList.contains('open')){closeMenus();m.classList.add('open');syncChecks();}});
  b.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '||e.key==='ArrowDown'){e.preventDefault();closeMenus();m.classList.add('open');syncChecks();const f=m.querySelector('.dd button,.dd a');if(f)f.focus();}});
});
document.addEventListener('mousedown',e=>{if(!e.target.closest('.m'))closeMenus();});
addEventListener('keydown',e=>{if(e.key==='Escape')closeMenus();});
function syncChecks(){
  document.querySelectorAll('[data-do^="view:"]').forEach(b=>b.setAttribute('aria-checked',b.dataset.do==='view:'+view&&source!=='bio'&&source!=='contact'));
  $('mi-dark').setAttribute('aria-checked',document.documentElement.dataset.theme==='dark');
}
function buildGo(){
  const s=C.socials||{},hasArch=(C.archive||[]).length>0;
  $('mb-go').innerHTML=[['featured','Featured Work'],['all','All Clips'],...(hasArch?[['archive','Archive']]:[]),['recent','Recently Added']].map(([k,l])=>`<button type="button" data-do="go:${k}">${l}</button>`).join('')+'<hr>'+[['Instagram',s.instagram],['TikTok',s.tiktok],['LinkedIn',s.linkedin]].filter(x=>x[1]).map(([l,u])=>`<a href="${esc(u)}" target="_blank" rel="noopener">${l}</a>`).join('');
  const icons={Instagram:['linear-gradient(#ffb86b,#e0407a 55%,#7a3fd0)','<rect x="4" y="4" width="16" height="16" rx="4.5"/><circle cx="12" cy="12" r="3.6"/><path d="M16.8 7.2h.01"/>'],TikTok:['linear-gradient(#4a4a4a,#0b0b0b)','<path d="M13 4v10.5a3 3 0 1 1-3-3M13 4c.5 2.4 2.2 4 4.5 4.2"/>'],LinkedIn:['linear-gradient(#5aa0e8,#1a5fa8)','<rect x="4" y="8" width="16" height="11" rx="1.5"/><path d="M9 8V6.5A1.5 1.5 0 0 1 10.5 5h3A1.5 1.5 0 0 1 15 6.5V8M4 13h16"/>']};
  $('dk-links').innerHTML=[['Instagram',s.instagram],['TikTok',s.tiktok],['LinkedIn',s.linkedin]].filter(x=>x[1]).map(([l,u])=>`<a class="it" href="${esc(u)}" target="_blank" rel="noopener"><span class="ic" style="--g:${icons[l][0]}"><svg viewBox="0 0 24 24">${icons[l][1]}</svg></span><span class="tip">${l}</span></a>`).join('');
  $('mb-name').textContent=C.name||'Tanner Hill Dodd';$('win-title').textContent=C.name||'Tanner Hill Dodd';
  bindDock();
}
/* traffic lights */
function toggleZoom(){document.body.classList.toggle('zoomed');store.set('retro-zoom',document.body.classList.contains('zoomed')?'1':'');setTimeout(layoutFlow,380);}
function restore(bounce){
  if(!document.body.classList.contains('mini')){if(bounce){const d=$('dk-lib');d.classList.remove('bounce');void d.offsetWidth;d.classList.add('bounce');}return;}
  document.body.classList.remove('mini');setTimeout(layoutFlow,520);
}
$('w-close').onclick=()=>{location.href=exitHref;};
$('w-min').onclick=()=>{if(playing&&playing.el)playing.el.pause();document.body.classList.add('mini');};
$('w-zoom').onclick=toggleZoom;
$('win-title').parentElement.addEventListener('dblclick',e=>{if(!e.target.closest('.lights'))toggleZoom();});
if(store.get('retro-zoom'))document.body.classList.add('zoomed');
/* dock magnification */
function bindDock(){
  const dock=$('dock'),its=[...dock.querySelectorAll('.it')];const base=50,max=78,reach=130;
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  dock.onmousemove=e=>{if(reduce)return;its.forEach(it=>{const r=it.getBoundingClientRect();const d=Math.abs(e.clientX-(r.left+r.width/2));const sz=base+(max-base)*Math.max(0,Math.cos(Math.min(d/reach,1)*Math.PI/2));it.style.width=it.style.height=sz+'px';});};
  dock.onmouseleave=()=>its.forEach(it=>it.style.width=it.style.height='');
}
/* clock */
function tick(){const d=new Date();$('clock').textContent=d.toLocaleDateString(undefined,{weekday:'short'})+' '+d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'});}
tick();setInterval(tick,15000);
/* keyboard shortcuts like the menus say */
addEventListener('keydown',e=>{
  if(!(e.metaKey||e.ctrlKey))return;const k=e.key.toLowerCase();
  if(k==='o'){e.preventDefault();openWin(cur);}else if(k==='d'){e.preventDefault();$('theme').click();}
});

load().then(buildGo);
})();
</script>
